<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="CineMatch — a fast, precision movie and TV recommendation engine. No account, no tracking, just better picks." />
    <meta name="theme-color" content="#0a0714" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9fd" media="(prefers-color-scheme: light)" />
    <title>CineMatch — find what to watch next</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint to avoid a flash of the wrong theme —
      // src/lib/theme.ts re-applies this on load and owns it from there.
      (function () {
        try {
          var stored = localStorage.getItem('cinematch-theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical, inlined so it paints before the app's own CSS has even
         been requested — covers the gap between first paint and the JS
         bundle finishing parse/exec, which on a slow connection or a
         low-end phone can be a very visible blank screen otherwise.
         Removed by main.ts once the first screen has actually mounted. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07050f;
        transition: opacity 280ms ease;
      }
      html[data-theme='light'] #boot-loader {
        background: #faf9fd;
      }
      #boot-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader svg {
        animation: boot-spin 0.85s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="14" stroke="#2a2350" stroke-width="3" />
        <path d="M31 17a14 14 0 0 0-14-14" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" />
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
