<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="CineMatch — a fast, precision movie and TV recommendation engine. No server account, nothing tracked off your device, just better picks that improve the more you rate." />
    <meta name="theme-color" content="#07050f" />
    <meta name="color-scheme" content="dark light" />
    <title>CineMatch — find what to watch next</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <script>
      // Applied before first paint so a reload never flashes the wrong mode
      // or palette. src/lib/appearance.ts re-applies (and fully validates)
      // everything on load and owns it from there. Everything read here is
      // checked against a whitelist — stored text is never written into the
      // document as markup or CSS.
      (function () {
        try {
          var root = document.documentElement;
          var BG = {
            aurora: ['#07050f', '#f7f3ee'], 'noir-gold': ['#0b0a08', '#f6f2e9'], oceanic: ['#050d14', '#edf5f8'],
            ember: ['#0f0709', '#fbf2ec'], forest: ['#050d09', '#edf4ee'], 'velvet-rose': ['#0e0612', '#faf0f5'],
            'indie-paper': ['#14100b', '#f5efe0'], monochrome: ['#000000', '#ffffff']
          };
          var p = null;
          try { p = JSON.parse(localStorage.getItem('cinematch-appearance:v1') || 'null'); } catch (e) {}
          if (!p || p.version !== 1) p = {};
          var legacy = localStorage.getItem('cinematch-theme');
          var mode = p.mode === 'dark' || p.mode === 'light' ? p.mode
            : (!p.mode && (legacy === 'dark' || legacy === 'light') ? legacy : 'system');
          if (mode === 'system') mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var palette = BG[p.palette] ? p.palette : 'aurora';
          var motion = p.motion === 'full' || p.motion === 'subtle' || p.motion === 'off' ? p.motion
            : (window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'subtle');
          root.setAttribute('data-theme', mode);
          root.setAttribute('data-palette', palette);
          root.setAttribute('data-motion', motion);
          root.style.colorScheme = mode;
          root.style.setProperty('--boot-bg', BG[palette][mode === 'light' ? 1 : 0]);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical, inlined so it paints before the app's own CSS has even
         been requested — covers the gap between first paint and the JS
         bundle finishing parse/exec, which on a slow connection or a
         low-end phone can be a very visible blank screen otherwise.
         Removed by main.ts once the first screen has actually mounted. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg, #07050f);
        transition: opacity 280ms ease;
      }
      #boot-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader svg {
        animation: boot-spin 0.85s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="14" stroke="#2a2350" stroke-width="3" />
        <path d="M31 17a14 14 0 0 0-14-14" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" />
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
